<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSK ONLINE SERVICES - Calculator</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      background:#f0f8ff;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:500px;
      margin:auto;
      background:#fff;
      padding:20px;
      border-radius:10px;
      box-shadow:0 4px 15px rgba(0,0,0,.1);
    }

    h2{
      text-align:center;
      color:#007bff;
    }

    label{
      display:block;
      margin-top:15px;
      font-weight:bold;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:5px;
      font-size:16px;
      border:1px solid #ccc;
      border-radius:6px;
      box-sizing:border-box;
    }

    input:disabled{
      background:#eee;
    }

    button{
      width:100%;
      margin-top:20px;
      padding:12px;
      background:#007bff;
      color:#fff;
      border:none;
      border-radius:6px;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#0056b3;
    }

    .btns{
      display:flex;
      gap:10px;
      margin-top:15px;
    }

    .btns button{
      flex:1;
      margin-top:0;
    }

    .receipt{
      display:none;
      margin-top:25px;
      padding:20px;
      border:1px dashed #999;
      border-radius:10px;
      background:#fff;
      font-family:monospace;
      white-space:pre-line;
    }

    .footer{
      text-align:center;
      margin-top:25px;
      color:#777;
      font-size:14px;
    }
  </style>
</head>

<body>

<div class="container">

<h2>DSK ONLINE SERVICES</h2>

<label>Amount Added (₹)</label>
<input type="number" id="amountAdded">

<label>OR Final Bank Amount (₹)</label>
<input type="number" id="bankAmount">

<label>Platform Charges (%)</label>
<input type="number" id="platformRate" value="2" step="0.1" min="0" max="10">

<label>Fixed Server Fee (₹)</label>
<input type="number" id="fixedFee" value="15">

<button onclick="calculate()">Generate Receipt</button>

<div class="btns">
<button onclick="shareWhatsApp()">Share via WhatsApp</button>
</div>

<div class="receipt" id="receiptOutput"></div>

<div class="footer">
DSK ONLINE SERVICES | 85550 34821
</div>

</div>

<script>

function formatDateTime(){

const d=new Date();

const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const day=String(d.getDate()).padStart(2,"0");
const month=months[d.getMonth()];
const year=d.getFullYear();

let hours=d.getHours();

const minutes=String(d.getMinutes()).padStart(2,"0");
const seconds=String(d.getSeconds()).padStart(2,"0");

const ampm=hours>=12?"PM":"AM";

hours=hours%12||12;

hours=String(hours).padStart(2,"0");

return `${day} ${month} ${year}, ${hours}:${minutes}:${seconds} ${ampm}`;

}

function calculate(){

const amountAddedVal=document.getElementById("amountAdded").value.trim();

const bankAmountVal=document.getElementById("bankAmount").value.trim();

const rate=parseFloat(document.getElementById("platformRate").value)/100;

const fixed=parseFloat(document.getElementById("fixedFee").value);

let amount,toBank,platformFee,totalFee;

if(amountAddedVal){

amount=parseFloat(amountAddedVal);

platformFee=amount*rate;

totalFee=platformFee+fixed;

toBank=amount-totalFee;

}else if(bankAmountVal){

toBank=parseFloat(bankAmountVal);

amount=(toBank+fixed)/(1-rate);

platformFee=amount*rate;

totalFee=platformFee+fixed;

}else{

alert("Please enter an amount.");

return;

}

const receipt=
`-------------------------------
DSK ONLINE SERVICES
Transaction Receipt
-------------------------------
Date       : ${formatDateTime()}
Contact    : 85550 34821

Amount     : ₹${amount.toFixed(2)}
Platform % : ${(rate*100).toFixed(2)}%
Platform ₹ : ₹${platformFee.toFixed(2)}
Fixed Fee  : ₹${fixed.toFixed(2)}
-------------------------------
Total Fee  : ₹${totalFee.toFixed(2)}
To Bank    : ₹${toBank.toFixed(2)}
-------------------------------

Other Services Available:
• Credit Card Swiping
• Travel Ticket Booking
• ITR Filing

-------------------------------
Thank you for choosing
DSK ONLINE SERVICES
Contact: 85550 34821
-------------------------------`;

const box=document.getElementById("receiptOutput");

box.style.display="block";

box.textContent=receipt;

}

function shareWhatsApp(){

const text=document.getElementById("receiptOutput").textContent.trim();

if(!text){

alert("Generate receipt first");

return;

}

window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");

}

const amountAddedInput=document.getElementById("amountAdded");

const bankAmountInput=document.getElementById("bankAmount");

amountAddedInput.addEventListener("input",function(){

bankAmountInput.disabled=this.value.trim()!=="";

});

bankAmountInput.addEventListener("input",function(){

amountAddedInput.disabled=this.value.trim()!=="";

});

</script>

</body>
</html>
